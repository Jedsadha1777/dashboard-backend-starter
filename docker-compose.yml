services:
  postgres:
    image: postgres:15-alpine
    container_name: dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dashboard
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dashboard-network

  redis:
    image: redis:7-alpine
    container_name: dashboard-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dashboard-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dashboard-api:latest
    container_name: dashboard-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: dashboard
      DB_SSLMODE: disable
      DB_TIMEZONE: UTC
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      
      # Server
      SERVER_PORT: 3000
      ENVIRONMENT: development
      
      # JWT
      JWT_SECRET: your-super-secret-key-change-this-in-production-minimum-32-chars
      JWT_EXPIRY_MINUTES: 1440
      
      # Security
      SECURITY_MIN_PASSWORD_LENGTH: 12
      
      # Features
      AUTO_SEED: "true"
      ENABLE_SWAGGER: "true"
      ENABLE_METRICS: "true"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - dashboard-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  dashboard-network:
    driver: bridge